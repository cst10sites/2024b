<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Assignment 4</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!--create style.css and change to href="style.css"-->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>
  <body>
    <h2>Cookie Clicker</h2>
    <input type="image" src="https://www.pngall.com/wp-content/uploads/2016/07/Cookie-Free-Download-PNG.png" alt="Cookie" onclick="updateCPS();" width="100">
    <p id="cpsDisplay"></p>
    <hr>
    <h2>HTML/CSS/JS Quiz</h2>
    <p>Click <a href="index.html">here</a> to play the quiz. </p>
    <script>
      // global variables
      var nClicks = 0;
      var startTime = new Date().getTime();

      function updateCPS() {
        if (nClicks == 0) {
          // first click
          // 1. reset startTime
          startTime = new Date();
          document.getElementById("cpsDisplay").innerHTML = "Cookies Per Second"
          // 2. increase nClicks by 1
          nClicks++;
        } else {
          // subsequent clicks:
          // 1. create variable currentTime
          var currentTime = new Date();
          // 2. create variable timeElapsed and subtract start and currentTime
          var timeElapsed = (currentTime - startTime) / 1000;
          // 3. calculate CPS = nClicks ÷ timeElapsed 
          var CPS = nClicks / timeElapsed;
          //    BUT timeElapsed be measured in seconds (not milliseconds)
          // 4. display CPS using id
          document.getElementById("cpsDisplay").innerHTML = "Cookies Per Second " + CPS;
          // 5. increase nClicks by 1
          nClicks++;
        }
      }
    </script>
  </body>
</html>
