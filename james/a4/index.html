<body>
<h2>Cookie Clicker</h2>
<input alt="cookie button" type="image" src="https://media.senscritique.com/media/000007132706/source_big/Cookie_Clicker.png" onclick="updateCPS();">
<button onclick="reset();">Reset</button>

<p id="cpsDisplay"></p>
<p id="totalClicks">  </p>
<p id="timeElapsed"></p>

<hr>
<h2>HTML/CSS/JS Quiz</h2>
<p>Click <a href="quiz.html">here</a> to play the quiz.</p>

<script>
// global variables
var nClicks = 0;
var startTime = new Date();

function updateCPS() {
	if (nClicks == 0) {
		// first click
		startTime = new Date();
		nClicks = nClicks + 1;
	}
	else {
		// subsequent clicks:
		var currentTime = new Date();
		var timeElapsed = (currentTime - startTime) / 1000;
		var cps = nClicks / timeElapsed
		//    BUT timeElapsed be measured in seconds (not milliseconds)
		
		nClicks = nClicks + 1;
		let cpss = cps.toFixed(2);
		var totalClicks = nClicks
		document.getElementById("totalClicks").innerHTML = "Total Clicks: " + totalClicks;
		document.getElementById("timeElapsed").innerHTML = "Time Elapsed: " + timeElapsed;
		document.getElementById("cpsDisplay").innerHTML = "CPS: " + cpss;
	}

}

setInterval(updateTime, 10);
function updateTime() {
if (nClicks >=1) {
var currentTime = new Date();
var timeElapsed = (currentTime - startTime)/ 1000;
let timee = timeElapsed.toFixed(1);
document.getElementById("timeElapsed").innerHTML = timee;
document.getElementById("timeElapsed").innerHTML = "Time: " + timee + " seconds";

}
}

	function reset() {
			location.reload(); // easiest but not best practice
		} //end of reset

</script>
</body>
