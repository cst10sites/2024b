<h2><u>HTML/CSS Quiz</u></h2>
<form>
	<label>What does HTML stand for? Please be capital-sensitive </label><br>
	<input type="text" id="user"><br>
	<input type="button" value="Submit" onclick="showUserPassword();">
	<input type="reset">
<!--ask at least one question related to HTML/CSS/JS-->
</form>
<form>
	<label>What's the correct term for a line break?:</label>
    <br>
    <input type="radio" name="group" id="secret">
    <!--name="group" allow us to select ONE within "group"-->
    <label>&lt;breakline&gt;</label>
    <br>
    <input type="radio" name="group">
    <label>line break</label>
    <br>
    <input type="radio" name="group">
    <label>&lt;lb&gt;</label>
    <br>
    <input type="radio" name="group" id="correctAnswer">
    <label>&lt;br&gt;</label>
    <br>
    <input type="button" value="Submit" onclick="checkRadio();">
    <input type="reset">
</form>
<form>
	<h3>Checkboxes</h3>
    <label>Which one of these tags are in a table? Name all possible answers.</label>
    <br>
    <!--Need to add multiple id for JavaScript to work-->
    <!--choice 1-->
    <input type="checkbox" id="correctAnswer1">
    <label>&lt;tr&gt;</label>
    <br>
<!--choice 2-->
    <input type="checkbox" id="correctAnswer2">
    <label>&lt;td&gt;</label>
    <br>
    <!--choice 3-->
    <input type="checkbox" id="wrong">
    <label>&lt;style&gt;</label>
    <br>
    <!--choice 4-->
    <input type="checkbox" id="wrong2">
    <label>&lt;text&gt;</label>
    <br>
    <!--button onclick="checkSeuss();">Answer</button-->
    <!--input type="button" is recommended for forms because button resets-->
    <input type="button" value="OK" onclick="checkSeuss();">
    <input type="reset">
</form>
<form>
    <label>What is Canvas used for?</label>
    <!-- reminder: need id and value attributes for JavaScript-->
    <select id="canvas">
        <option value="Manipulate data">Manipulate data</option>
        <option value="Display records">Display records</option>
        <option value="Draw graphics">Draw graphics</option>
        <option value="Create draggable events">Create draggable events</option>
    </select>
    <br>
    <input type="button" value="OK" onclick="checkCar();">
    <input type="reset">
</form>
<p id="carDisplay">2023&copy;</p>

<h2><u>Cookie Clicker</u></h2>

<script>
	<!---JavaScript-->


// Example 1: textbox
function showUserPassword() {
    var user = document.getElementById('user').value;
    // get value from text input
    alert("Answer: " + user);
    // \n means new line

    if (user == "Hyper Text Markup Language") {
        alert("Correct!");
    }
    else {
        alert("WRONG!");
    }
}

// Example 2: radio button
function checkRadio() {
    var correctAnsSelected = document.getElementById('correctAnswer').checked; // true or false

    if (correctAnsSelected == true) {
        alert("THAT IS CORRECT!");
    }
    else {
        alert("WRONG!!!");
    }
}
function checkSeuss() {
    var tr = document.getElementById("correctAnswer1").checked; // T or F
    var td = document.getElementById("correctAnswer2").checked; // T or F
    var style = document.getElementById("wrong").checked; // T or F
    var text = document.getElementById("wrong2").checked; // T or F

    if (tr == true && td == true && style == false && text == false) {
        alert("CORRECT!");
    }
    else if (tr == true && td == false && style == false && text == false) {
    	alert("That's correct, but you're missing one more");
    }
    else if (td == true && tr == false && style == false && text == false) {
    	alert("That's correct, but you're missing one more");
    }
    else {
        alert("NUH UH");
    }
}
function checkCar() {
    var car = document.getElementById("canvas"). value;
    document.getElementById("carDisplay"). innerHTML = "Your answer: " + car + ".";

    if (car == "Draw graphics") {
        alert("CORRECT!");
}
	else {
		alert("absolutely wrong");
	}
}

</script>
