<h2>Lightning Clicker Game</h2>
<input type="image" alt="lightning" src="lightning.jpg" width="400" height="400" onclick="updateCPS();">
<button onclick="window.location.reload();">Reset</button>
<p> Clicks per second: <span id="cpsDisplay"></span></p>
<p> Time elapsed: <span id="timeDisplay"></span>s</p>
<p> Clicks: <span id="clickDisplay"></span></p>
<hr>
<script>
    // global variables
    var nClicks = 0;
    var startTime = new Date().getTime();

    function updateCPS() {
        if (nClicks == 0) {
            // first click
            startTime = new Date().getTime();
            nClicks++;
        } else {
            // subsequent clicks
            var currentTime = new Date();
            var timeElapsed = (currentTime - startTime) / 1000;
            nClicks++;
            document.getElementById("clickDisplay").innerHTML = nClicks;
        }
    }

    setInterval(updateTime, 100);

    function updateTime() {
        if (nClicks >= 1) {
            var currentTime = new Date();
            var timeElapsed = (currentTime - startTime) / 1000;
            var timee = timeElapsed.toFixed(1);
            var cps = nClicks / timeElapsed;
            var cpss = cps.toFixed(2);
            document.getElementById("timeDisplay").innerHTML = timee;
            document.getElementById("cpsDisplay").innerHTML = cpss;
        }
    }
</script>
