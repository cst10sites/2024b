  	<h1>Quiz</h1>
  	<form>
    <label>Which component in a PC is designed for graphic processing?</label>
    
    <br><br>
    <input type="radio" name="group">
    <label>CPU</label>
    <br><br>
    <input type="radio" name="group" id="rightAnswer">
    <label>GPU</label>
    <br><br>
    <input type="radio" name="group">
    <label>Motherboard</label>
    <br><br>
    <input type="radio" name="group">
    <label>Case</label>
    <br><br>
    <input type="button" value="Submit" onclick="checkRadio();">
    <input type="reset">
</form>
<br><br>
<form>
    <label>What does RAM stand for?</label>
    
    <br><br>
    <input type="radio" name="group">
    <label>Random Available Memory</label>
    <br><br>
    <input type="radio" name="group" id="correctAnswer">
    <label>Random Access Memory</label>
    <br><br>
    <input type="radio" name="group">
    <label>Recognizable Access Memory</label>
    <br><br>
    <input type="radio" name="group">
    <label>Recognizable Available Memory</label>
    <br><br>
    <input type="button" value="Submit" onclick="checkRadio2();">

</form>
