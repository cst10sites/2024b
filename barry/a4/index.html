<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignment 4</title>
<link rel="stylesheet" type="text/css" href="style.css">
<link rel="icon" type="image/x-icon" href="cookie.ico">
</head>
<body>
<h2>Cookie Clicker</h2>
<div class="center">
<p>Click the cookie as fast as you can if you are ready.</p>
<p>CPS: <span id="cpsDisplay"></span></p>
<p>Time Elapsed: <span id="timeDisplay"></span></p>
<p>Clicks: <span id="Clicks"></span></p>

<button onclick="resetCPS();">Reset</button>
<br><br>
<input type="image" alt="png" src="cookie.png" onclick="updateCPS();">
</div>
<hr>
<h2>HTML/CSS/JS Quiz</h2>
<div class="center">
<p>Click <a href="quiz.html">here</a> to play the quiz.</p>
</div>
<script>
// global variables
var nClicks = 0;
var startTime = new Date().getTime();

function updateCPS() {
	if (nClicks == 0) {
		// first click
		// 1. reset startTime
		// 2. increase nClicks by 1
		startTime = new Date();
		nClicks = nClicks + 1;
		document.getElementById('Clicks').innerHTML = nClicks;
		document.getElementById('cpsDisplay').innerHTML = "Click as fast as you can!";
	}
	else {
		// subsequent clicks:
		// 1. create variable currentTime
		// 2. create variable timeElapsed and subtract start and currentTime
		// 3. calculate CPS = nClicks ÷ timeElapsed 
		//    BUT timeElapsed be measured in seconds (not milliseconds)
		// 4. display CPS using id
		// 5. increase nClicks by 1
		var currentTime = new Date();
		var timeElapsed = (currentTime - startTime) / 1000;
		var CPS = nClicks / timeElapsed;
		const toFixedCPS = CPS.toFixed(2);
		document.getElementById("cpsDisplay").innerHTML = toFixedCPS;
		document.getElementById('Clicks').innerHTML = nClicks;
	}
nClicks = nClicks + 1;
}

function resetCPS() {
	location.reload();
}

setInterval(updateTime, 100);

function updateTime() {
	if (nClicks > 1) {
	var currentTime = new Date();
	var timeElapsed = (currentTime - startTime) / 1000;
	document.getElementById('timeDisplay').innerHTML = timeElapsed;
 }
}


</script>
</body>
</html>
