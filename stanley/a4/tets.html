    <h2>Quiz 1</h2>

    <h3>Radio Buttons</h3>
    <!--Example 2-->
    <form>
        <label>How do you create an image in HTML:</label>
        <br>
        <input type="radio" name="group" id="correctAnswer">
        <!--name="group" allow us to select ONE within "group"-->
        <label>&lt;img src="pic_trulli.jpg" alt="Italian Trulli"&gt;</label>
        <br>
        <input type="radio" name="group">
        <label>&lt;img alt="Italian" src="cool.jpg"&gt;</label>
        <br>
        <input type="radio" name="group">
        <label>Ethan is dumb</label>
        <br>
        <input type="button" value="Submit" onclick="checkRadio();">
        <input type="reset">
    </form>

    <!--JavaScript-->
    <script>
        // Example 2: radio button
        function checkRadio() {
            var correctAnsSelected = document.getElementById('correctAnswer').checked; // true or false

            if (correctAnsSelected) {
                alert("Good job! This is correct!");
            } else {
                alert("You should try again!");
            }
        }
    </script>
