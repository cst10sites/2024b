<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Assignment 4</title>
		<link rel="stylesheet" type="text/css" href="style.css">
		<link rel="icon" type="image/x-icon" href="dizzy.ico">
		<!--create style.css and change to href="style.css"-->
	</head>
	<body>
		<h2>Cookie Clicker Game</h2>
		<input type="image" alt=cookie src="cookie.png" onclick="updateCPS();">
		<button onclick="window.location.reload();">Reset</button>
		<p> Clicks per second: <span id="cpsDisplay"></span>
		</p>
		<p> Time elapsed: <span id="timeDisplay"></span> s </p>
		<p> Clicks: <span id="clickDisplay"></span>
		</p>
		<hr>
		<h2>HTML/CSS/JS Quiz</h2>
		<p>Click <a href="quiz.html">here</a> to play the quiz. </p>
		<script>
			// global variables
			var nClicks = 0;
			var startTime = new Date().getTime();

			function updateCPS() {
				if (nClicks == 0) {
					// first click
					// 1. reset startTime
					// 2. increase nClicks by 1
					startTime = new Date().getTime();
					nClicks++;
				} else {
					// subsequent clicks:
					// 1. create variable currentTime
					// 2. create variable timeElapsed and subtract start and currentTime
					// 3. calculate CPS = nClicks ÷ timeElapsed 
					//    BUT timeElapsed be measured in seconds (not milliseconds)
					// 4. display CPS using id
					// 5. increase nClicks by 1
					var currentTime = new Date();
					var timeElapsed = (currentTime - startTime) / 1000;
					nClicks++;
					document.getElementById("clickDisplay").innerHTML = nClicks;
				}
			}
			setInterval(updateTime, 1);

			function updateTime() {
				if (nClicks >= 1) {
					var currentTime = new Date();
					var timeElapsed = (currentTime - startTime) / 1000;
					let timee = timeElapsed.toFixed(1);
					var cps = nClicks / timeElapsed;
					let cpss = cps.toFixed(2);
					document.getElementById("timeDisplay").innerHTML = timee;
					document.getElementById("cpsDisplay").innerHTML = cpss;
				}
			}
		</script>
	</body>
</html>
