<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>extras</title>
	<style>
		body{
			margin: 0px 1000px 0px 10px;
		}
		div{
			background-color: burlywood;
			color: white;
			border-style: solid;
			border-width: 3px;
			border-color: black;
			padding: 10px;
		}
	</style>
</head>
<body>
	<p>This text is outside of the &lt;div&gt;</p>
	<div>
		<p>this text is inside of the &lt;div&gt;, this means I can change the background and the border and manipulate the text separated from the outside</p>
	</div>
</body>
</html>
