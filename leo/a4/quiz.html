<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css">
	<title>Quiz</title>
</head>
<body>
	<h1>HTML Quiz</h1>
	<form>
	<label>Which character is used to indicate an end tag?</label>
    <br>
    <input type="radio" name="group" id="correctAnswer">
    <!--name="group" allow us to select ONE within "group"-->
    <label>/</label>
    <br>
    <input type="radio" name="group">
    <label>*</label>
    <br>
    <input type="radio" name="group">
    <label><</label>
    <br>
    <input type="radio" name="group">
    <label>﷽</label>
    <br>
    <input type="button" value="Submit" onclick="checkRadio();">
    <input type="reset"></form>
    <hr>
	<h2>Cookie Clicker game</h2>
<p>Click <a href="index.html">here</a> to play the game.</p>


</body>
<script>
	function checkRadio() {
    var correctAnsSelected = document.getElementById('correctAnswer').checked; // true or false

    if (correctAnsSelected == true) {
        alert("Correct!!! You're officially smart.");
    }
    else {
        alert("Wrong! Try again when you've improved your HTML knowledge.");
    }

}
</script>
</html>
