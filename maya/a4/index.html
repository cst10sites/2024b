<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 4</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        body {
            color: black;
            margin: 100px 500px; /* top-bottom left-right */
            font-family: Arial;
        }
    </style>
</head>
<body>
<h2>Cookie Clicker</h2>
<button onclick="updateCPS();"><img src="cookie.jpg" alt="cookie" style="width: 400px;"></button>
<br>
<button onclick="startStopWatch();" id="lapButton">Start</button>
<button onclick="reset();">Reset</button>
<p id="CPSDisplay"></p>
<p id="totalClicks"></p>
<p id="nClicks"></p>
<p id="timeDisplay"></p>
<p id="lapDisplay"></p>
<hr>
<h2>HTML/CSS/JS Quiz</h2>
<p>Click <a href="quiz.html">here</a> to play the quiz.</p>

<script>
    // global variables
    var nClicks = 0;
    var startTime = new Date().getTime();

    setInterval(updateTime, 100);

    function updateTime() {
        if (nClicks > 0) {
            var currentTime = new Date();
            var timeElapsed = (currentTime - startTime) / 1000;
            document.getElementById("timeDisplay").innerHTML = timeElapsed.toFixed(2);
        }
    }

    function startStopWatch() {
        if (nClicks == 0) {
            document.getElementById("lapButton").innerHTML = "Start";
        } else {
            var currentTime = new Date();
            var timeElapsed = (currentTime - startTime) / 1000;
        }
        nClicks++;
    }

    function updateCPS() {
        if (nClicks == 0) {
            // first click
            // 1. reset startTime
            // 2. increase nClicks by 1
            startTime = new Date().getTime();
            nClicks++;
        } else {
            var currentTime = new Date();
            var timeElapsed = (currentTime - startTime) / 1000;
            var CPS = nClicks / timeElapsed;
            document.getElementById("CPSDisplay").innerHTML = CPS.toFixed(2);
            document.getElementById("totalClicks").innerHTML = "total clicks: " + nClicks;
            nClicks++;
        }
    }

    function reset() {
        nClicks = 0;
        startTime = new Date().getTime();
        document.getElementById("CPSDisplay").innerHTML = "";
        document.getElementById("totalClicks").innerHTML = "";
        document.getElementById("nClicks").innerHTML = "";
        document.getElementById("timeDisplay").innerHTML = "";
        document.getElementById("lapDisplay").innerHTML = "";
    }
</script>
</body>
</html>
